# Facts that belong to the CV and nowhere else. Everything the CV shares with
# the site - name, contacts, skills, experience, education - is read from
# src/content by scripts/build-cv.mjs, so the two cannot drift apart. Only what
# the site does not say lives here.
headings:
  about: О себе
  skills: Ключевые навыки
  experience: Опыт работы
  projects: Проекты
  education: Образование
  certificates: Сертификаты

# Not a section of its own: languages are a skill, and a heading plus a line
# costs a page that has none to spare.
languagesLabel: Языки

target: DevOps специалист
location: Худжанд, Таджикистан — готов к релокации в Ташкент

summary: >-
  Разработчик и инженер инфраструктуры: серверы, доступы, сети и мониторинг
  того, что не должно падать. Безопасность здесь уже часть работы, а не
  намерение — ролевые модели доступа и защищённые ветки в GitLab,
  централизованные учётные записи на FreeIPA, разбор инцидентов. Хочу перейти в
  DevSecOps и встраивать проверки в CI/CD и SSDLC. Имеется профильное
  образование по защите информационных систем.

# Present on the site, deliberately absent from the CV.
stackOmit: [Coolify]
showEducationDetails: false

# Appended to the experience entry whose role matches the key. The build fails
# on a key that matches nothing, so renaming a role in src/content cannot leave
# these lines silently unprinted.
extraLines:
  Middle DevOps/SRE:
    - Веду ролевые модели доступа, защищённые ветки и пайплайны в GitLab CI/CD, централизую учётные записи на FreeIPA.
  Junior DevOps/SRE:
    - 'Автоматизировал развёртывание виртуальных машин с Terraform, Ansible и FreeIPA, развернул Kubernetes-платформу на RKE2 и Rancher.'

projects:
  - >-
    Активно разрабатываю коммерческие решения, более чем в 10 проектах:
    NJ-Cosmetics.com, imongroup.com, EliteBurger.online, AziziMoliya.com,
    ChicagoBurger.tj, Safo Pharmacy (safo.mubi.dev) и так далее по проектам,
    что уже под NDA и/или не достойны особого внимания.
  - >-
    Кроме коммерческих, также занимаюсь полностью open-source (AGPL) пет-проектами,
    к примеру: AFK4.NET — комплексное решение для управления компьютерными клубами,
    ManClient — booking-сервис для бизнеса и его клиентов. Ещё 6 проектов, можете
    ознакомиться на моей странице в GitHub.

certificates:
  - name: Kaspersky Academy — Cybersecurity Certification
    detail: курс по кибербезопасности
    period: окт. 2021
