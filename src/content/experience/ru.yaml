entries:
  - period: янв. 2026 - настоящее время
    employer: Банк Эсхата
    role: Middle DevOps/SRE
    lines:
      - Проектирую и развиваю инфраструктуру банка, чтобы критичные сервисы оставались стабильными, предсказуемыми и безопасными.
      - Автоматизирую развёртывание с Ansible и Docker, стандартизирую сервисы и развиваю мониторинг и алертинг на Prometheus и Grafana.
      - 'Отвечаю за жизненный цикл серверных сред и ключевых сервисов: производительность, планирование мощности, поддержку релизов и устранение инцидентов.'
  - period: июль 2025 - янв. 2026
    employer: Банк Эсхата
    role: Junior DevOps/SRE
    lines:
      - Автоматизировал развёртывание и настройку серверов с Ansible и SemaphoreUI.
      - Настраивал мониторинг в Prometheus и Grafana, анализировал метрики и устранял узкие места.
      - Разворачивал и поддерживал серверные среды, оптимизировал производительность и работал с командами разработки и сотрудниками банка.
  - period: окт. 2024 - июнь 2025
    employer: CJSC Behdoshti
    role: IT Technician
    lines:
      - Собирал и обслуживал компьютеры, монтировал и поддерживал сети.
      - Настраивал сетевое, компьютерное и медицинское оборудование.
      - Обучал сотрудников работе с компьютерами и программами, оказывал IT-поддержку и выполнял выездной ремонт.
printEntries:
  - period: июль 2025 - настоящее время
    employer: Банк Эсхата
    role: Junior DevOps/SRE → Middle DevOps/SRE
    lines:
      - 'Автоматизировал развёртывание виртуальных машин с Terraform, Ansible и FreeIPA: вместо двух-четырёх часов около 30 минут, до 10 серверов параллельно.'
      - Развернул и обслуживаю Kubernetes-платформу на RKE2 и Rancher, стандартизирую сервисы с Docker и мониторю их в Prometheus и Grafana.
  - period: окт. 2024 - июнь 2025
    employer: CJSC Behdoshti
    role: IT Technician
    lines:
      - 'Разработал на Go и Angular мониторинг для 50+ клиник: первое реагирование сократилось примерно с шести рабочих часов до одной минуты, типичное устранение с десяти часов до одного.'
