sections:
  practice:
    title: Что я умею
    rail: инфраструктура, автоматизация, инструменты
    items:
      - title: Держу критичные сервисы на ногах
        description: Linux, сети, Docker и кластеры Kubernetes (RKE2). Слежу за метриками в Prometheus и Grafana, разбираю причины инцидентов, а не симптомы.
      - title: Убираю ручную работу из развёртывания
        description: Terraform поднимает виртуальные машины, Ansible доводит настройку, FreeIPA раздаёт доступы. Сервер готов за 30 минут, до десяти параллельно.
      - title: Пишу инструменты, когда готовых нет
        description: Go, Angular, Flutter и .NET. От сервиса мониторинга сети клиник до внутренних панелей, которыми пользуется команда.
