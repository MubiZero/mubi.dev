entries:
  - id: server-provisioning
    title: Автоматизация развёртывания серверов
    metrics:
      - value: '30'
        unit: мин
        label: подготовка сервера
    problem: 'Ручная подготовка одного сервера, от ресурсов в vSphere и сети до ОС, пакетов и локальных пользователей, занимала от двух до четырёх часов.'
    action: 'Автоматизировал массовое развёртывание: Terraform создаёт виртуальные машины с нужными ресурсами и преднастройкой, Ansible завершает настройку, FreeIPA выдаёт доступы. Стандартизировал контейнеризацию и оркестрацию сервисов через RKE2/Rancher.'
    result: 'Подготовка сервера занимает около 30 минут, при этом можно развернуть до 10 серверов параллельно. Стандартизация ускоряет обслуживание и повышает устойчивость сервисов при флапах из-за неоптимизированного кода.'
  - id: branch-monitoring
    title: Мониторинг сетевых инцидентов для 50+ филиалов
    metrics:
      - value: '1'
        unit: мин
        label: до первого реагирования
      - value: 50+
        unit: ''
        label: филиалов под мониторингом
    problem: 'Централизованного мониторинга сети филиалов не было. О проблеме сначала сообщал сотрудник, затем IT читала чат и обращалась к провайдеру, поэтому первое реагирование занимало около шести рабочих часов, а устранение до десяти.'
    action: 'Написал на Go сервис, который следит за сетью более 50 филиалов. При потере связи он создаёт запрос провайдеру на расследование, фиксирует событие в веб-панели с Angular-дашбордом статусов и отправляет команде SMS-уведомление через локального провайдера.'
    result: 'Время до первого реагирования сократилось примерно с шести рабочих часов до одной минуты. Типичное время устранения сократилось с десяти рабочих часов до одного часа, в том числе потому, что провайдеры узнавали об инцидентах сразу.'
