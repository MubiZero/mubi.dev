server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The version number is free reconnaissance and buys nothing.
  server_tokens off;

  # TLS terminates at the proxy, so nginx would otherwise build every redirect
  # as http:// and send a visitor of https://mubi.dev/ru back out in plaintext.
  # Relative redirects keep the scheme, the host, and the port the client used.
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  location / {
    try_files $uri $uri/ =404;
  }

  # /cv and /cv.pdf are the addresses worth writing on a business card or
  # reading down a phone; the file behind them keeps the name a recruiter will
  # see in their downloads folder. Content-Disposition is what makes it save
  # rather than open in the browser's own viewer, and it carries the filename
  # independently of the URL, so the short address costs nothing.
  #
  # An add_header here replaces the inherited set rather than adding to it, so
  # the server-level headers are repeated instead of silently lost.
  location ~ ^/cv(\.pdf)?$ {
    add_header Content-Disposition 'attachment; filename="MukhamedovM_CV.pdf"' always;
    # Short, because a CV is republished without its address changing.
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    try_files /MukhamedovM_CV.pdf =404;
  }

  # One Cache-Control header, not two: `expires` and `add_header` write the
  # field independently, and a proxy that picks only one would drop either the
  # lifetime or the immutability. Astro hashes these filenames, so a year is safe.
  # An add_header here replaces the inherited set rather than adding to it,
  # so the server-level headers are repeated instead of silently lost.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  }

  error_page 404 /404.html;
}
