name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Content types are generated, not committed, so they have to exist
      # before anything typechecks against them.
      - run: npx astro sync

      - run: npm run check

      - run: npm test

      # Before the browser suite, which builds again itself: a broken build
      # should fail here in a minute rather than inside a Playwright timeout.
      - run: npm run build

      - name: Install the browser the e2e suite drives
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Keep the failing run's traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
